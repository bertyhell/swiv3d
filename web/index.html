<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWIV 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" hidden>
  <!-- Layout of the original: map globe top left, energy capsule top right,
       special weapon bottom left, score bottom right. -->
  <canvas id="globe" width="150" height="150" aria-label="Map"></canvas>
  <div id="objective"></div>
  <svg id="energy" viewBox="0 0 40 100" aria-label="Energy">
    <defs>
      <linearGradient id="chrome" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="#3a3d42"/><stop offset="0.28" stop-color="#e9edf2"/>
        <stop offset="0.5" stop-color="#9aa0a8"/><stop offset="0.8" stop-color="#5b6067"/>
        <stop offset="1" stop-color="#2b2e33"/>
      </linearGradient>
      <linearGradient id="energy-fill" x1="0" x2="1">
        <stop offset="0" stop-color="#a9adb3"/><stop offset="0.45" stop-color="#f4f6f8"/>
        <stop offset="1" stop-color="#8d9298"/>
      </linearGradient>
      <clipPath id="energy-window"><path d="M13 16 L28 13 L28 84 L13 87 Z"/></clipPath>
    </defs>
    <rect x="3" y="2" width="34" height="96" rx="17" fill="url(#chrome)" stroke="#16181b" stroke-width="1.2"/>
    <path d="M13 16 L28 13 L28 84 L13 87 Z" fill="#0b0c0e" stroke="#1d2024" stroke-width="1.5"/>
    <g clip-path="url(#energy-window)"><path id="energy-level" d="M13 87 L28 84 L28 13 L13 16 Z" fill="url(#energy-fill)"/></g>
    <ellipse cx="15" cy="10" rx="6" ry="3" fill="#fff" opacity="0.45"/>
  </svg>
  <div id="special">
    <svg id="special-icon" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <radialGradient id="ring" cx="0.35" cy="0.3" r="0.8">
          <stop offset="0" stop-color="#f1f3f6"/><stop offset="0.55" stop-color="#8f949b"/><stop offset="1" stop-color="#3b3e43"/>
        </radialGradient>
      </defs>
      <rect x="3" y="3" width="42" height="42" rx="13" fill="url(#ring)"/>
      <rect x="10" y="10" width="28" height="28" rx="6" fill="#0d0e10" stroke="#e5e7ea" stroke-width="1.5"/>
      <g id="special-glyph" fill="none" stroke="#f4f4f4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></g>
    </svg>
    <div id="special-text"><span id="special-count"></span><span id="special-name"></span></div>
  </div>
  <div id="score-block">
    <div id="score">0000000</div>
  </div>
  <canvas id="minimap" width="512" height="512" hidden></canvas>
  <div id="banner" hidden></div>
</div>

<div id="loader" class="panel" hidden>
  <p id="load-status" role="status"></p>
</div>

<!-- Front end in the style of the original: a heading in the game's 3D font (drawn by the
     renderer over a live flyover of a level), a grey header box and a list of options. -->
<div id="splash" hidden>
  <div class="splash-logo">SWIV <span>3D</span></div>
  <p class="blink">Press any key</p>
</div>

<div id="frontend" hidden>
  <div id="menu-box" role="menu">
    <div id="menu-header"></div>
    <ul id="menu-items"></ul>
  </div>
  <div id="menu-help"></div>
</div>

<div id="briefing" hidden>
  <canvas id="briefing-map"></canvas>
  <div id="briefing-skip">Press <kbd>Enter</kbd> to launch</div>
</div>

<script type="module" src="main.js"></script>
</body>
</html>
