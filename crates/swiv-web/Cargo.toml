[package]
name = "swiv-web"
description = "SWIV 3D in the browser: WebAssembly + WebGL 2 front-end"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
swiv-formats = { path = "../swiv-formats" }
swiv-core = { path = "../swiv-core" }
glam = "0.29"
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "HtmlCanvasElement", "WebGl2RenderingContext", "WebGlProgram", "WebGlShader",
  "WebGlBuffer", "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject", "console", "Window",
]
